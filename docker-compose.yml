version: "3.8"
services:
  web:
    build: .
    container_name: reversephys-web
    ports:
      - "3000:3000"
      - "8090:8090"
    volumes:
      - ./Contents:/app/Contents
      - ./backend/pb_data:/app/backend/pb_data
      - ~/.ssh:/root/.ssh:ro
    environment:
      # Use internal localhost for server-side Next.js data fetching
      - NEXT_PUBLIC_POCKETBASE_URL=http://127.0.0.1:8090
    restart: unless-stopped
